name: Deploy Bank Marketing API to AWS

on:
  push:
    branches: [ "feat/PB-20" ]

jobs:
  # ---- PASO 1: COMPILAR Y SUBIR LA IMAGEN A AMAZON ECR ----
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: bank-marketing-api
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ---- PASO 2: CONECTARSE POR SSH A LA EC2, BAJAR MODELO DE S3 Y ARRANCAR ----
  deploy:
    name: Deploy to Amazon EC2
    needs: build  # <--- Esto obliga a que espere a que el Paso 1 termine con éxito
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Executing remote SSH commands to deploy
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        # Pasamos los secretos como variables de entorno a la sesión SSH
        envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
        script: |
          # 1. Configurar credenciales de AWS dentro de la EC2 para poder conectarse a S3
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
          export AWS_DEFAULT_REGION=us-east-1

          # 2. Asegurar que la estructura física de carpetas exista en la EC2
          mkdir -p /home/ubuntu/dp261-g6/models

          # 3. Descargar el archivo versionado desde tu Bucket S3 (Punto 5 cumplido)
          aws s3 cp s3://proyecto-bank-marketing/final_model.pkl /home/ubuntu/dp261-g6/models/final_model.pkl

          # 4. Autenticar Docker con Amazon ECR dentro de la EC2
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 442249350005.dkr.ecr.us-east-1.amazonaws.com
          
          # 5. Descargar la última versión de la imagen desde ECR
          docker pull 442249350005.dkr.ecr.us-east-1.amazonaws.com/bank-marketing-api:latest
          
          # 6. Apagar y remover el contenedor anterior para liberar el puerto 8000
          docker stop api-marketing-container || true
          docker rm api-marketing-container || true
          
          # 7. Encender el nuevo contenedor mapeando la carpeta con el modelo descargado de S3
          docker run -d -p 8000:8000 \
            --name api-marketing-container \
            -v /home/ubuntu/dp261-g6/models:/app/models \
            442249350005.dkr.ecr.us-east-1.amazonaws.com/bank-marketing-api:latest
            
          # 8. Limpieza de imágenes huérfanas viejas para cuidar tus 6.7 GB de espacio
          docker image prune -f
